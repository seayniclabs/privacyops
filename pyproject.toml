[project]
name = "privacyops-mcp"
version = "0.1.0"
description = "MCP bundle for consumers tracking credit-bureau disputes and drafting dispute letters from fixed templates. Local only."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Seaynic Labs" }]
# mcp is capped below 2: 2.x removed FastMCP, and unpinned installs crash.
dependencies = [
    "mcp[cli]>=1.27,<2",
    "pydantic>=2.7",
]
keywords = ["mcp", "model-context-protocol", "fcra", "credit", "dispute", "privacy"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/seayniclabs/privacyops"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
privacyops-mcp = "privacyops_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/privacyops_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
